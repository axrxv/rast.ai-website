<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My AI Bot</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h1>MY AI</h1>

            <button id="newChat">
                + New Chat
            </button>

            <div class="sidebar-bottom">

                <p>My AI Bot</p>

                <p>Built by me 🚀</p>

            </div>

        </aside>


        <main class="chat-area">

            <header class="topbar">

                <h2>My AI Bot</h2>

            </header>


            <section id="messages"
                     class="messages">

                <div class="welcome">

                    <h1>
                        How can I help?
                    </h1>

                    <p>
                        Ask me anything.
                    </p>

                </div>

            </section>


            <div class="input-area">

                <textarea
                    id="messageInput"
                    placeholder="Message My AI..."
                    rows="1">
                </textarea>

                <button id="sendButton">
                    ➤
                </button>

            </div>


            <p class="disclaimer">
                My AI can make mistakes.
                Check important information.
            </p>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
